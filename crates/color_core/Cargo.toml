[package]
name = "agix-color-core"
version = "0.1.0"
edition = "2021"
description = "High-performance OKLCH color science, P3 gamut mapping, and APCA contrast calculation engine."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
